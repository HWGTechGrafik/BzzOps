<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Bee Tracking App Icon</title>
  <desc>Black and yellow beekeeping tracking app icon with bee, location pin, honeycomb and analytics.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE83B"/>
      <stop offset="1" stop-color="#F5A900"/>
    </linearGradient>
    <linearGradient id="beeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD92F"/>
      <stop offset="1" stop-color="#F3A600"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect x="24" y="24" width="976" height="976" rx="190" fill="#111820"/>

  <!-- Main honeycomb frame -->
  <path d="M512 118 L845 310 L845 694 L512 886 L179 694 L179 310 Z"
        fill="none" stroke="url(#gold)" stroke-width="34"
        stroke-linejoin="round"/>

  <!-- Location pin -->
  <path d="M512 132
           C452 132 405 180 405 239
           C405 317 512 389 512 389
           C512 389 619 317 619 239
           C619 180 572 132 512 132 Z"
        fill="url(#gold)"/>
  <circle cx="512" cy="229" r="36" fill="#111820"/>

  <!-- Tracking signal arcs -->
  <path d="M407 184 C373 203 352 237 348 275"
        fill="none" stroke="#FFD92F" stroke-width="18" stroke-linecap="round"/>
  <path d="M617 184 C651 203 672 237 676 275"
        fill="none" stroke="#FFD92F" stroke-width="18" stroke-linecap="round"/>

  <!-- Bee wings -->
  <g fill="#F7F8F4" stroke="#E8E9E5" stroke-width="8">
    <path d="M470 365
             C405 303 306 296 266 333
             C310 395 396 425 474 406 Z"/>
    <path d="M554 365
             C619 303 718 296 758 333
             C714 395 628 425 550 406 Z"/>
  </g>

  <!-- Wing inner lines -->
  <g fill="none" stroke="#C9CCC8" stroke-width="7" stroke-linecap="round">
    <path d="M286 340 L451 386"/>
    <path d="M738 340 L573 386"/>
    <path d="M325 320 L452 374"/>
    <path d="M699 320 L572 374"/>
  </g>

  <!-- Bee head -->
  <circle cx="512" cy="363" r="52" fill="#F4C11E"/>
  <path d="M477 344 C478 314 497 294 512 294 C527 294 546 314 547 344"
        fill="#111820"/>
  <circle cx="495" cy="354" r="7" fill="#F7F8F4"/>
  <circle cx="529" cy="354" r="7" fill="#F7F8F4"/>

  <!-- Antennae -->
  <path d="M493 322 C467 294 449 283 426 283"
        fill="none" stroke="#F7F8F4" stroke-width="12" stroke-linecap="round"/>
  <path d="M531 322 C557 294 575 283 598 283"
        fill="none" stroke="#F7F8F4" stroke-width="12" stroke-linecap="round"/>

  <!-- Bee body -->
  <path d="M445 411
           C445 371 579 371 579 411
           L561 568
           C554 620 470 620 463 568 Z"
        fill="url(#beeBody)" stroke="#111820" stroke-width="12"/>

  <!-- Bee stripes -->
  <path d="M455 447 Q512 470 569 447 L574 481 Q512 505 450 481 Z" fill="#111820"/>
  <path d="M459 506 Q512 529 565 506 L569 540 Q512 565 455 540 Z" fill="#111820"/>

  <!-- Bee legs -->
  <g fill="none" stroke="#F7F8F4" stroke-width="11" stroke-linecap="round">
    <path d="M459 476 L425 510"/>
    <path d="M565 476 L599 510"/>
    <path d="M462 525 L425 555"/>
    <path d="M562 525 L599 555"/>
  </g>

  <!-- Honeycomb cells -->
  <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round">
    <path d="M198 595 L242 570 L286 595 L286 646 L242 671 L198 646 Z"/>
    <path d="M286 646 L330 621 L374 646 L374 697 L330 722 L286 697 Z"/>
    <path d="M242 671 L286 646 L330 671 L330 722 L286 747 L242 722 Z"/>
  </g>

  <!-- Analytics bars -->
  <g fill="url(#gold)">
    <rect x="671" y="638" width="45" height="86" rx="8"/>
    <rect x="729" y="586" width="45" height="138" rx="8"/>
    <rect x="787" y="528" width="45" height="196" rx="8"/>
  </g>
  <path d="M676 620 L750 566 L808 508"
        fill="none" stroke="#FFE83B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="676" cy="620" r="14" fill="#FFE83B"/>
  <circle cx="750" cy="566" r="14" fill="#FFE83B"/>
  <circle cx="808" cy="508" r="14" fill="#FFE83B"/>
</svg>
